name: H3 E11U02 v4 C04 Rear Identity Repair

on:
  push:
    branches:
      - fix/e11u02-h3-v4-c04-rear-identity-lock
    paths:
      - .github/live-tests/e11u02-v4-request.txt

permissions:
  contents: read
  actions: read

jobs:
  e11u02-v4-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MINIMAX_LIVE_API_KEY: ${{ secrets.MINIMAX_H3_API_KEY || secrets.MINIMAX_API_KEY }}
      MINIMAX_LIVE_BASE_URL: ${{ secrets.MINIMAX_H3_BASE_URL || 'https://autodl.art' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync

      - name: Download E11U02 v2 evidence for Shot 1 and soundtrack
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e11u02-v2-zero-text-physical-state-evidence
          path: v2_evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36148270693

      - name: Download E11U02 v3 evidence for repaired Shot 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e11u02-v3-targeted-shot2-blank-token-evidence
          path: v3_evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36160563284

      - name: Verify reused source assets
        run: |
          test -s v2_evidence/E11U02_SHOT1_provider_raw.mp4
          test -s v3_evidence/E11U02_SHOT2_V3_provider_raw.mp4
          test -s v2_evidence/project/fixtures/E11U02_canonical_soundtrack.wav

      - name: Run E11U02 v4 deterministic contract gates
        run: uv run pytest -q tests/unit/test_e11u02_v4_contract.py

      - name: Compile changed Python
        run: uv run python -m py_compile scripts/experiments/run_e11u02_minimax_h3_v4_live.py tests/unit/test_e11u02_v4_contract.py

      - name: Ruff E11U02 v4 delta
        run: |
          uv run ruff check --ignore UP037 \
            scripts/experiments/run_e11u02_minimax_h3_v4_live.py \
            tests/unit/test_e11u02_v4_contract.py

      - name: Credential preflight
        run: |
          if [ -z "$MINIMAX_LIVE_API_KEY" ]; then
            echo "NO_MINIMAX_API_KEY_SECRET"
            exit 2
          fi
          echo "MiniMax/AutoDL credential present; value is not printed."

      - name: Run one paid supplier call for repaired Shot 3
        run: uv run python scripts/experiments/run_e11u02_minimax_h3_v4_live.py

      - name: Probe final E11U02 artifact and extract dense review frames
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live_artifacts/E11U02/review_frames
          VIDEO="live_artifacts/E11U02/project/reference_videos/E11U02.mp4"
          test -s "$VIDEO"

          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels \
            -of json "$VIDEO" > live_artifacts/E11U02/ffprobe_final.json

          for T in 0.25 0.75 1.25 1.75 2.25 2.75 3.25 3.75 4.25 4.75 5.25 5.75 6.25 6.75 7.25 7.75 8.25 8.75 9.25 9.75 10.25 10.75 11.25 11.75 12.25 12.75 13.25 13.75 14.25 14.75; do
            ffmpeg -hide_banner -loglevel error -ss "$T" -i "$VIDEO" -frames:v 1 \
              "live_artifacts/E11U02/review_frames/frame_${T}.png"
          done

      - name: Upload E11U02 v4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e11u02-v4-c04-rear-identity-lock-evidence
          path: live_artifacts/E11U02
          if-no-files-found: warn
          retention-days: 14
