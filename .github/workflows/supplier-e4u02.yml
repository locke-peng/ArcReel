name: Supplier Test E4U02

on:
  push:
    branches:
      - delta/h3-native-compliance-ref2va-t2va

permissions:
  contents: read
  actions: read

jobs:
  supplier-e4u02:
    if: contains(github.event.head_commit.message, '[supplier-e4u02]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINIMAX_H3_API_KEY: ${{ secrets.MINIMAX_H3_API_KEY }}
      MINIMAX_H3_BASE_URL: ${{ secrets.MINIMAX_H3_BASE_URL }}
      SUPPLIER_BUNDLE_DIR: /tmp/e4u02-bundle
      SUPPLIER_OUTPUT_DIR: artifacts/supplier-e4u02
      SUPPLIER_TEST_RESOLUTION: 480p横
      KEY_ARTIFACT_ID: "10813146201"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ensure ffmpeg tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Verify supplier secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MINIMAX_H3_API_KEY"
          test -n "$MINIMAX_H3_BASE_URL"
          echo "::add-mask::$MINIMAX_H3_BASE_URL"
          echo "Supplier credentials are configured."

      - name: Download one-time E4U02 envelope key artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="/tmp/e4u02-key"
          mkdir -p "$WORK"
          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$KEY_ARTIFACT_ID/zip"             -o "$WORK/key.zip"
          unzip -q "$WORK/key.zip" -d "$WORK"
          test -s "$WORK/cert.pem"
          test -s "$WORK/private.pem.enc"
          echo "E4U02 envelope artifact downloaded."

      - name: Decrypt private E4U02 test bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC=".github/supplier-bundles/E4U02"
          KEY="/tmp/e4u02-key"
          WORK="/tmp/e4u02-secure"
          mkdir -p "$WORK" "$SUPPLIER_BUNDLE_DIR"

          cat "$SRC"/bundle.part.* | tr -d '\r\n ' | base64 -d > "$WORK/bundle.cms"
          echo "ca7295e7f040745706030d917e2133e6c247a2b2dbb57b2c5c190d3e771b567f  $WORK/bundle.cms" | sha256sum -c -

          openssl enc -d -aes-256-cbc -pbkdf2             -in "$KEY/private.pem.enc"             -out "$WORK/private.pem"             -pass env:MINIMAX_H3_API_KEY

          openssl cms -decrypt -binary -inform DER             -in "$WORK/bundle.cms"             -recip "$KEY/cert.pem"             -inkey "$WORK/private.pem"             -out "$WORK/bundle.tar.gz"

          tar -xzf "$WORK/bundle.tar.gz" -C "$SUPPLIER_BUNDLE_DIR"
          rm -f "$WORK/private.pem" "$WORK/bundle.tar.gz" "$WORK/bundle.cms"

          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("/tmp/e4u02-bundle")
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert m["unit_id"]=="E4U02"
          assert m["workflow_id"]=="minimax_h3_zm_u24"
          assert m["duration_seconds"]==15
          assert m["prompt_sha256"]=="1d649f984ce7ef8e15f2b1e4a3610bf96e9965b16d26e67cd38172d6d79d9a2c"
          assert hashlib.sha256((root/"prompt.txt").read_bytes()).hexdigest()==m["prompt_sha256"]
          expected=[
            "55724c4906dec31d3c1ba889f87b1e835560223f4f3b07a13b711210eb9f6c1b",
            "6a6049f2faa53fbc254ba50802f3549c017e14842e4e73309f47ab84af699cd7",
            "98d24de3d92210a0bb5ce9d5ac346dc701014e56f01060fe349b2922eafcfd95",
            "2002139f713072e99ec076c8563974014fc8f6ab9ab2336387a64d1cd6a1472c",
          ]
          assert [x["sha256"] for x in m["references"]]==expected
          for ref in m["references"]:
            p=root/ref["filename"]
            assert hashlib.sha256(p.read_bytes()).hexdigest()==ref["sha256"]
            assert p.stat().st_size==int(ref["size_bytes"])
          print("E4U02 encrypted bundle integrity PASS")
          print("E4U02 prompt SHA:", m["prompt_sha256"])
          print("E4U02 reference count:", len(m["references"]))
          PY

      - name: Submit exactly one E4U02 supplier task
        run: uv run python scripts/run_native_supplier_bundle.py

      - name: Probe generated E4U02 video
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$SUPPLIER_OUTPUT_DIR/E4U02.mp4"
          ffprobe -v error             -show_entries format=duration,size             -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels             -of json "$VIDEO" > "$SUPPLIER_OUTPUT_DIR/ffprobe.json"

          mkdir -p "$SUPPLIER_OUTPUT_DIR/frames"
          for t in 0.5 2.5 4.5 5.5 7.5 9.5 10.5 12.5 14.5; do
            ffmpeg -hide_banner -loglevel error -ss "$t" -i "$VIDEO" -frames:v 1               "$SUPPLIER_OUTPUT_DIR/frames/frame_${t}.jpg"
          done

          ffmpeg -hide_banner -loglevel error -i "$VIDEO" -vn -acodec pcm_s16le             "$SUPPLIER_OUTPUT_DIR/audio.wav" || true

      - name: Upload E4U02 supplier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-e4u02-evidence
          path: artifacts/supplier-e4u02
          if-no-files-found: warn
          retention-days: 3
