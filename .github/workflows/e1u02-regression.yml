name: H3 Native Compliance + Project Regression

on:
  push:
    branches:
      - delta/h3-native-compliance-ref2va-t2va
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h3-native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run imported project representative units and baseline regressions
        run: |
          uv run pytest \
            tests/unit/test_h3_prompt_compiler.py \
            tests/unit/test_h3_v6_director.py \
            tests/unit/test_h3_native_compliance.py \
            tests/unit/test_h3_preview_runtime_lock.py \
            tests/unit/lib/test_speech_presentation.py \
            tests/unit/test_e1u02_imported_regression.py \
            tests/unit/test_multi_unit_project_regression.py \
            tests/integration/server/services/test_presentation_read_model.py \
            tests/integration/server/services/test_project_archive_reference_video.py \
            tests/unit/lib/project_migrations/test_project_migration_v14_v15.py \
            tests/integration/lib/project_migrations/test_project_migration_v14_v15.py \
            -q

      - name: Compile changed Python
        run: |
          uv run python -m py_compile \
            lib/video_prompt_compilers/h3_prompt_compiler.py \
            lib/video_prompt_compilers/h3_director_compiler.py \
            lib/speech_presentation.py \
            lib/artifact_planner.py \
            server/services/presentation_read_model.py \
            server/services/project_archive.py \
            tests/unit/test_h3_prompt_compiler.py \
            tests/unit/test_h3_v6_director.py \
            tests/unit/test_e1u02_imported_regression.py \
            tests/unit/test_h3_native_compliance.py \
            tests/unit/test_multi_unit_project_regression.py \
            tests/integration/server/services/test_project_archive_reference_video.py

      - name: Ruff delta
        run: |
          # The baseline director compiler already has unrelated legacy lint debt.
          # Check correctness/import/style classes without rewriting baseline behavior.
          uv run ruff check \
            --ignore UP037,RUF046,B905,RUF007,PERF401,SIM102 \
            lib/video_prompt_compilers/h3_prompt_compiler.py \
            lib/video_prompt_compilers/h3_director_compiler.py \
            lib/speech_presentation.py \
            lib/artifact_planner.py \
            server/services/presentation_read_model.py \
            server/services/project_archive.py \
            tests/unit/test_h3_prompt_compiler.py \
            tests/unit/test_h3_v6_director.py \
            tests/unit/test_e1u02_imported_regression.py \
            tests/unit/test_h3_native_compliance.py \
            tests/unit/test_multi_unit_project_regression.py \
            tests/integration/server/services/test_project_archive_reference_video.py

      - name: Package tested ArcReel source
        run: |
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='**/__pycache__' \
            -czf /tmp/arcreel-h3-native-compliance-src.tar.gz .

      - name: Upload tested ArcReel source
        uses: actions/upload-artifact@v4
        with:
          name: arcreel-h3-native-compliance-src
          path: /tmp/arcreel-h3-native-compliance-src.tar.gz
          if-no-files-found: error
          retention-days: 3