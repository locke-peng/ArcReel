name: H3 Phase 5 Master Acceptance

on:
  pull_request:
    paths:
      - "lib/reference_video/**"
      - "server/services/h3_repair_*.py"
      - "server/routers/h3_repairs.py"
      - "tests/e2e/reference_video/test_h3_phase5_*.py"
      - "tests/integration/lib/reference_video/test_h3_repair_*.py"
      - "tests/integration/server/services/test_h3_repair_*.py"
      - "tests/integration/server/routers/test_h3_repairs.py"
      - "tests/unit/lib/reference_video/test_h3_*.py"
      - "tests/unit/server/services/test_h3_repair_operator.py"
      - "tests/unit/test_h3_*.py"
      - "tests/unit/test_e*.py"
      - ".github/workflows/h3-phase5-master-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5-master-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      H3_PHASE5_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      H3_PHASE5_EVIDENCE_DIR: .artifacts/h3-phase5-master

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ArcReel dependencies
        run: uv sync

      - name: Phase 5 E2E acceptance matrix
        run: |
          uv run pytest -q             tests/e2e/reference_video/test_h3_phase5_production_lifecycle_e2e.py             tests/e2e/reference_video/test_h3_phase5_interruption_resume_e2e.py             tests/e2e/reference_video/test_h3_phase5_stale_approval_e2e.py             tests/e2e/reference_video/test_h3_phase5_duplicate_execution_e2e.py             tests/e2e/reference_video/test_h3_phase5_project_isolation_e2e.py             tests/e2e/reference_video/test_h3_phase5_policy_safety_matrix_e2e.py

      - name: Phase 5 orchestration subsystem regression
        run: |
          uv run pytest -q             tests/integration/lib/reference_video/test_h3_repair_approval_service.py             tests/integration/lib/reference_video/test_h3_repair_queue.py             tests/integration/server/services/test_h3_repair_tasks.py             tests/integration/server/services/test_h3_repair_reqa.py             tests/integration/server/routers/test_h3_repairs.py             tests/unit/server/services/test_h3_repair_operator.py             tests/unit/lib/reference_video/test_h3_repair_ticket.py             tests/unit/lib/reference_video/test_h3_safe_escalation_loop.py

      - name: Phase 4 H3 runtime regression
        run: |
          uv run pytest -q             tests/unit/lib/reference_video/test_h3_auto_repair_loop.py             tests/unit/lib/reference_video/test_h3_runtime_gate.py             tests/unit/lib/reference_video/test_h3_timeline_runtime.py             tests/unit/lib/reference_video/test_h3_exact_text_runtime.py             tests/unit/lib/reference_video/test_h3_audio_runtime.py             tests/unit/test_h3_prompt_compiler.py             tests/unit/test_h3_preview_runtime_lock.py

      - name: Six representative Unit regression
        run: |
          uv run pytest -q             tests/unit/test_e12u06_contract.py             tests/unit/test_e4u02_v4_dialogue_detached.py             tests/unit/test_e13u01_v2_contract.py             tests/unit/test_e13u03_v1_contract.py             tests/unit/test_e11u02_v3_repair_contract.py             tests/unit/test_e15u03_v2_timeline_contract.py

      - name: Emit master acceptance evidence
        run: |
          mkdir -p "$H3_PHASE5_EVIDENCE_DIR"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "scenario": "Phase 5 Master Acceptance",
              "tested_sha": os.environ["H3_PHASE5_TESTED_SHA"],
              "phase5_e2e": ["E2E-01", "E2E-02", "E2E-03", "E2E-04", "E2E-05", "E2E-06"],
              "phase5_orchestration_regression": "PASS",
              "phase4_h3_runtime_regression": "PASS",
              "six_representative_unit_regression": "PASS",
              "paid_minimax_calls": 0,
              "status": "FINAL_PASS",
          }
          path = Path(os.environ["H3_PHASE5_EVIDENCE_DIR"]) / "phase5-master-acceptance.json"
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload Phase 5 master evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h3-phase5-master-${{ github.event.pull_request.head.sha || github.sha }}
          path: .artifacts/h3-phase5-master
          if-no-files-found: warn
          retention-days: 30
