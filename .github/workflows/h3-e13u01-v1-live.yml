name: H3 E13U01 v1 Identity Screen Continuity Supplier Test

on:
  push:
    branches:
      - test/e13u01-h3-v1-identity-screen-continuity

permissions:
  contents: read
  actions: read

jobs:
  e13u01-v1-live:
    if: contains(github.event.head_commit.message, '[supplier-e13u01]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MINIMAX_H3_API_KEY: ${{ secrets.MINIMAX_H3_API_KEY }}
      MINIMAX_H3_BASE_URL: ${{ secrets.MINIMAX_H3_BASE_URL }}
      SUPPLIER_BUNDLE_DIR: /tmp/e13u01-bundle
      SUPPLIER_OUTPUT_DIR: artifacts/supplier-e13u01
      SUPPLIER_TEST_RESOLUTION: 480p横
      E12_ACCEPTED_RUN_ID: "35999316411"
      E12_ACCEPTED_VIDEO_SHA256: "eae4c6d8531b0be0be65108d2689cf091149abce52afa8ba84e44cad2dec7782"
      E15_ASSET_COMMIT: "a5c192427d47c94fe9e60c9c0e5ca62aa35b4be8"
      C01_CANONICAL_SHA256: "50893f22ed6e38bd3764f088ec2cd7e1f5ccecaaadd707e0d63ee2e217782bb9"

    steps:
      - name: Checkout E13U01 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          uv sync
          ffprobe -version | head -n 1

      - name: E13U01 contract gate before any paid request
        run: |
          uv run pytest tests/unit/test_e13u01_v1_contract.py -q
          uv run python -m py_compile scripts/experiments/run_native_supplier_bundle.py

      - name: Verify supplier secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MINIMAX_H3_API_KEY"
          test -n "$MINIMAX_H3_BASE_URL"
          echo "::add-mask::$MINIMAX_H3_BASE_URL"
          echo "Supplier credentials are configured."

      - name: Download accepted E12U06 v4 evidence
        uses: actions/download-artifact@v4
        with:
          name: supplier-e12u06-evidence
          path: /tmp/e12-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.E12_ACCEPTED_RUN_ID }}

      - name: Recover canonical C01 asset from accepted E15U03 encrypted bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/e15-source
          SEC=/tmp/e15-secure
          DEC=/tmp/e15-decrypted
          mkdir -p "$SRC" "$SEC" "$DEC"

          git fetch --no-tags origin "$E15_ASSET_COMMIT"
          for f in cert.pem.b64 private.pem.enc.b64 bundle.part.00 bundle.part.01 bundle.part.02 bundle.part.03 bundle.part.04 bundle.part.05 bundle.part.06 bundle.part.07 bundle.part.08; do
            git show "$E15_ASSET_COMMIT:.github/supplier-bundles/E15U03/$f" > "$SRC/$f"
          done

          tr -d '\r\n ' < "$SRC/cert.pem.b64" | base64 -d > "$SEC/cert.pem"
          tr -d '\r\n ' < "$SRC/private.pem.enc.b64" | base64 -d > "$SEC/private.pem.enc"
          cat "$SRC"/bundle.part.* | tr -d '\r\n ' | base64 -d > "$SEC/bundle.cms"
          echo "7162bf8c9b0d552868d8e35072a726bc08ecaecb2d1a009047e21288c2db20e3  $SEC/bundle.cms" | sha256sum -c -

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$SEC/private.pem.enc" \
            -out "$SEC/private.pem" \
            -pass env:MINIMAX_H3_API_KEY

          openssl cms -decrypt -binary -inform DER \
            -in "$SEC/bundle.cms" \
            -recip "$SEC/cert.pem" \
            -inkey "$SEC/private.pem" \
            -out "$SEC/bundle.tar.gz"

          tar -xzf "$SEC/bundle.tar.gz" -C "$DEC"
          rm -f "$SEC/private.pem" "$SEC/bundle.tar.gz" "$SEC/bundle.cms"

          uv run python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          root = Path("/tmp/e15-decrypted")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          wanted = os.environ["C01_CANONICAL_SHA256"]
          match = next((r for r in manifest["references"] if r["sha256"] == wanted), None)
          if not match:
              raise SystemExit("canonical C01 reference not found in accepted E15U03 bundle")
          src = root / match["filename"]
          actual = hashlib.sha256(src.read_bytes()).hexdigest()
          if actual != wanted:
              raise SystemExit(f"C01 SHA mismatch: {actual}")
          Path("/tmp/e13-assets").mkdir(parents=True, exist_ok=True)
          shutil.copy2(src, "/tmp/e13-assets/C01_ShenZhiyi.png")
          print("C01 canonical identity asset PASS", actual)
          PY

      - name: Build E13U01 references from accepted continuity evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/e13-assets "$SUPPLIER_BUNDLE_DIR"

          E12_VIDEO="$(find /tmp/e12-evidence -type f -name 'E12U06.mp4' -print -quit)"
          test -n "$E12_VIDEO"
          echo "$E12_ACCEPTED_VIDEO_SHA256  $E12_VIDEO" | sha256sum -c -

          ffmpeg -hide_banner -loglevel error -ss 9.5 -i "$E12_VIDEO" -frames:v 1 \
            /tmp/e13-assets/E12U06_stage_continuity.jpg
          ffmpeg -hide_banner -loglevel error -ss 4.5 -i "$E12_VIDEO" -frames:v 1 \
            /tmp/e13-assets/E12U06_screen_source.jpg

          uv run python - <<'PY'
          import subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          src = Path("/tmp/e13-assets/E12U06_screen_source.jpg")
          out = Path("/tmp/e13-assets/E13U01_screen_anchor.png")
          img = Image.open(src).convert("RGB")
          draw = ImageDraw.Draw(img)
          draw.rectangle((0, 0, img.width, img.height), fill=(0, 0, 0))

          font_path = subprocess.check_output(
              ["bash", "-lc", "fc-match -f '%{file}' 'Noto Sans CJK SC' | head -n1"],
              text=True,
          ).strip()
          f1 = ImageFont.truetype(font_path, 74)
          f2 = ImageFont.truetype(font_path, 46)
          lines = [("沈知意", f1, 155), ("天枢联合创始人", f2, 285)]
          for value, font, y in lines:
              box = draw.textbbox((0, 0), value, font=font)
              x = (img.width - (box[2] - box[0])) // 2
              draw.text((x, y), value, font=font, fill=(245, 245, 245))
          img.save(out)
          print("screen anchor created", out)
          PY

          cp /tmp/e13-assets/E12U06_stage_continuity.jpg "$SUPPLIER_BUNDLE_DIR/stage_continuity.jpg"
          cp /tmp/e13-assets/E13U01_screen_anchor.png "$SUPPLIER_BUNDLE_DIR/screen_anchor.png"
          cp /tmp/e13-assets/C01_ShenZhiyi.png "$SUPPLIER_BUNDLE_DIR/C01_ShenZhiyi.png"
          cp .github/supplier-prompts/E13U01.v1.txt "$SUPPLIER_BUNDLE_DIR/prompt.txt"

          uv run python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("/tmp/e13u01-bundle")
          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          prompt_sha = sha(root / "prompt.txt")
          refs = []
          for filename, role in [
              ("stage_continuity.jpg", "E12U06_v4_stage_continuity"),
              ("screen_anchor.png", "canonical_identity_screen"),
              ("C01_ShenZhiyi.png", "C01_identity_master"),
          ]:
              p = root / filename
              refs.append({
                  "filename": filename,
                  "role": role,
                  "sha256": sha(p),
                  "size_bytes": p.stat().st_size,
              })

          expected_c01 = "50893f22ed6e38bd3764f088ec2cd7e1f5ccecaaadd707e0d63ee2e217782bb9"
          assert refs[2]["sha256"] == expected_c01

          manifest = {
              "unit_id": "E13U01",
              "workflow_id": "minimax_h3_zm_u24",
              "duration_seconds": 10,
              "resolution": "480p横",
              "prompt_sha256": prompt_sha,
              "references": refs,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("artifacts/supplier-e13u01").mkdir(parents=True, exist_ok=True)
          (Path("artifacts/supplier-e13u01") / "input_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False))
          PY

      - name: Submit exactly one E13U01 supplier task
        run: uv run python scripts/experiments/run_native_supplier_bundle.py

      - name: Probe and densely sample E13U01
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$SUPPLIER_OUTPUT_DIR/E13U01.mp4"
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels \
            -of json "$VIDEO" > "$SUPPLIER_OUTPUT_DIR/ffprobe.json"

          mkdir -p "$SUPPLIER_OUTPUT_DIR/frames"
          for t in 0.5 1.5 2.5 3.5 4.5 5.25 5.75 6.25 6.75 7.25 7.75 8.25 8.75 9.25 9.75; do
            ffmpeg -hide_banner -loglevel error -ss "$t" -i "$VIDEO" -frames:v 1 \
              "$SUPPLIER_OUTPUT_DIR/frames/frame_${t}.jpg"
          done

          uv run python - <<'PY'
          from pathlib import Path
          from PIL import Image

          frame_dir = Path("artifacts/supplier-e13u01/frames")
          files = sorted(frame_dir.glob("frame_*.jpg"), key=lambda p: float(p.stem.split("_", 1)[1]))
          imgs = [Image.open(p).convert("RGB") for p in files]
          if not imgs:
              raise SystemExit("no review frames")
          thumb_w = 432
          thumb_h = 240
          cols = 3
          rows = (len(imgs) + cols - 1) // cols
          sheet = Image.new("RGB", (thumb_w * cols, thumb_h * rows), "black")
          for i, img in enumerate(imgs):
              img = img.resize((thumb_w, thumb_h))
              sheet.paste(img, ((i % cols) * thumb_w, (i // cols) * thumb_h))
          sheet.save("artifacts/supplier-e13u01/E13U01_dense_contact_sheet.jpg", quality=92)
          PY

          ffmpeg -hide_banner -loglevel error -i "$VIDEO" -vn -acodec pcm_s16le \
            "$SUPPLIER_OUTPUT_DIR/audio.wav" || true

      - name: Upload E13U01 supplier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-e13u01-v1-evidence
          path: artifacts/supplier-e13u01
          if-no-files-found: warn
          retention-days: 5
