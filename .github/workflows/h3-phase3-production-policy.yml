name: H3 Phase 3 Production Policy

on:
  push:
    branches:
      - phase3/h3-production-policy
    paths:
      - "lib/reference_video/h3_production_policy.py"
      - "tests/unit/lib/reference_video/test_h3_production_policy.py"
      - "docs/experiments/h3-phase3-production-policy.md"
      - ".github/workflows/h3-phase3-production-policy.yml"
  workflow_dispatch:

jobs:
  phase3-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Phase 3 policy unit tests
        run: |
          pytest -q tests/unit/lib/reference_video/test_h3_production_policy.py

      - name: Compile
        run: |
          python -m py_compile lib/reference_video/h3_production_policy.py

      - name: Ruff
        run: |
          ruff check lib/reference_video/h3_production_policy.py tests/unit/lib/reference_video/test_h3_production_policy.py
