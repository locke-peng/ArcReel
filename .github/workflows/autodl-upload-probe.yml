name: AutoDL Upload Protocol Probe

on:
  push:
    branches:
      - delta/h3-native-compliance-ref2va-t2va

permissions:
  contents: read

jobs:
  probe-upload:
    if: contains(github.event.head_commit.message, '[probe-upload]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Probe upload protocol without creating provider task
        run: uv run python scripts/probe_autodl_upload.py
      - name: Upload sanitized probe
        uses: actions/upload-artifact@v4
        with:
          name: autodl-upload-probe
          path: artifacts/autodl-upload-probe
          if-no-files-found: error
          retention-days: 2
