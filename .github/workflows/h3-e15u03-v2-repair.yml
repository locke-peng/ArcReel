name: H3 E15U03 v2 Deterministic Timeline Repair

on:
  push:
    branches:
      - fix/e15u03-h3-v2-deterministic-timeline
    paths:
      - .github/live-tests/e15u03-v2-request.txt

permissions:
  contents: read
  actions: read

jobs:
  e15u03-v2-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync

      - name: Run E15U03 v2 deterministic contract gates
        run: uv run pytest -q tests/unit/test_e15u03_v2_timeline_contract.py

      - name: Compile changed Python
        run: uv run python -m py_compile scripts/experiments/run_e15u03_v2_deterministic_timeline.py tests/unit/test_e15u03_v2_timeline_contract.py

      - name: Ruff E15U03 v2 delta
        run: |
          uv run ruff check --ignore UP037 \
            scripts/experiments/run_e15u03_v2_deterministic_timeline.py \
            tests/unit/test_e15u03_v2_timeline_contract.py

      - name: Download exact paid E15U03 supplier evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supplier-e15u03-evidence
          path: upstream_e15u03
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: locke-peng/ArcReel
          run-id: 36009732060

      - name: Run deterministic E15U03 5-5-5 repair
        run: |
          uv run python scripts/experiments/run_e15u03_v2_deterministic_timeline.py \
            --upstream-dir upstream_e15u03 \
            --output-dir live_artifacts/E15U03

      - name: Extract dense E15U03 v2 review frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live_artifacts/E15U03/review_frames
          VIDEO="live_artifacts/E15U03/project/reference_videos/E15U03.mp4"
          test -s "$VIDEO"

          for T in 0.25 0.75 1.25 1.75 2.25 2.75 3.25 3.75 4.25 4.75 5.25 5.75 6.25 6.75 7.25 7.75 8.25 8.75 9.25 9.75 10.25 10.75 11.25 11.75 12.25 12.75 13.25 13.75 14.25 14.75; do
            ffmpeg -hide_banner -loglevel error -ss "$T" -i "$VIDEO" -frames:v 1 \
              "live_artifacts/E15U03/review_frames/frame_${T}.png"
          done

      - name: Upload E15U03 v2 repair evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e15u03-v2-deterministic-timeline-evidence
          path: live_artifacts/E15U03
          if-no-files-found: error
          retention-days: 14
